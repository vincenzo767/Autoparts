spring.application.name=roviautoparts-api
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/rovidb;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.auto-commit=false
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=8MB
app.upload-dir=${UPLOAD_DIR:./uploads}
app.supabase.url=${SUPABASE_URL:}
app.supabase.secret-key=${SUPABASE_SECRET_KEY:}
app.supabase.bucket=${SUPABASE_BUCKET:parts}

app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:120}
app.cookie.secure=${COOKIE_SECURE:false}
app.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.security.max-failed-logins=5
app.security.lock-minutes=15
app.security.ip-login-attempts-per-15min=30
app.security.ip-registrations-per-hour=10

app.reservations.hold-days=7
app.reservations.grace-days-after-pickup=2
app.reservations.check-interval=PT30M

app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Roel Batawang}
app.seed-demo-data=${SEED_DEMO_DATA:true}
app.demo-customer.email=${DEMO_CUSTOMER_EMAIL:}
app.demo-customer.password=${DEMO_CUSTOMER_PASSWORD:}
