services:
  - type: web
    name: rovi-autoparts-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/public/featured
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: native
      - key: SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES
        value: ".*"
      - { key: CORS_ALLOWED_ORIGINS, sync: false }
      - { key: DB_URL, sync: false }
      - { key: DB_USERNAME, sync: false }
      - { key: DB_PASSWORD, sync: false }
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_SECRET_KEY, sync: false }
      - { key: ADMIN_EMAIL, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
